name: Download data from Google Drive
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Download CSV files from Google Drive
        env:
          GOOGLE_DRIVE_FOLDER: ${{ secrets.GOOGLE_DRIVE_FOLDER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTPUT_DIR: example.csv
        run: |
          if [ -z "$GOOGLE_DRIVE_FOLDER" ]; then
            echo "GOOGLE_DRIVE_FOLDER secret not set. Skipping download."
            exit 0
          fi
          python scripts/download_gdrive_data.py

      - name: Check for changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data from Google Drive folder"
            git push origin HEAD:${{ github.ref }}
          fi