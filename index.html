<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маршруты Тольятти</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; color: #222; background: #f5f5f5; }
#app { display: flex; height: 100vh; }
#sidebar { width: 360px; min-width: 320px; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; overflow: hidden; }
#sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid #2a2a4e; }
#sidebar-header h1 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 10px; }
#filter { width: 100%; padding: 8px 12px; border: 1px solid #3a3a5e; border-radius: 6px; background: #16162a; color: #e0e0e0; font-size: 13px; outline: none; transition: border-color .2s; }
#filter:focus { border-color: #5a7aff; }
#filter::placeholder { color: #666; }
#route-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.route-group { border-bottom: 1px solid #2a2a4e; }
.route-group-header { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #ccc; transition: background .15s; }
.route-group-header:hover { background: #2a2a4e; }
.route-group-header .arrow { transition: transform .2s; font-size: 10px; color: #888; }
.route-group-header.open .arrow { transform: rotate(90deg); }
.route-group-header .badge { margin-left: auto; background: #5a7aff; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.variant-item { padding: 8px 16px 8px 36px; cursor: pointer; font-size: 13px; color: #aaa; transition: background .15s, color .15s; border-left: 3px solid transparent; }
.variant-item:hover { background: #2a2a4e; color: #ddd; }
.variant-item.active { background: #2a2a5e; color: #fff; border-left-color: #5a7aff; }
#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#route-info { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; min-height: 48px; }
#route-info h2 { font-size: 16px; font-weight: 600; color: #333; }
#route-info .variant-label { font-size: 13px; color: #888; margin-top: 2px; }
#map-container { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }
#map-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #e8e8e8; color: #999; font-size: 15px; flex-direction: column; gap: 8px; }
#stops-panel { max-height: 240px; overflow-y: auto; background: #fff; border-top: 1px solid #e0e0e0; padding: 8px 20px; }
#stops-panel h3 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
#stops-stats { font-size: 12px; color: #888; margin-bottom: 8px; }
#stops-stats .ok { color: #27ae60; }
#stops-stats .ko { color: #e74c3c; }
#stops-list { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
#stops-list li { font-size: 12px; padding: 3px 10px; background: #f0f2ff; border-radius: 12px; color: #444; }
#stops-list li .missing { color: #e74c3c; font-weight: 600; }
#stops-list li::before { content: attr(data-idx); color: #999; margin-right: 4px; font-size: 11px; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f5; z-index: 9999; flex-direction: column; gap: 12px; }
#loading .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #5a7aff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading.hidden { opacity: 0; pointer-events: none; transition: opacity .4s; }
#error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f5; z-index: 9998; flex-direction: column; gap: 12px; padding: 20px; text-align: center; }
#error.hidden { display: none; }
#error h2 { color: #e74c3c; }
#error p { color: #666; max-width: 480px; }
@media (max-width: 768px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; min-width: unset; max-height: 40vh; }
  #stops-panel { max-height: 160px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Загрузка данных маршрутов...</span>
</div>

<div id="error" class="hidden">
  <h2>Ошибка загрузки</h2>
  <p id="error-msg"></p>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Маршруты Тольятти <span id="route-count" style="font-weight:400;font-size:13px;color:#888"></span></h1>
      <input id="filter" type="text" placeholder="Фильтр по номеру маршрута…">
    </div>
    <div id="route-list"></div>
  </div>
  <div id="content">
    <div id="route-info">
      <h2>Выберите маршрут из списка</h2>
      <div class="variant-label">Нажмите на маршрут слева, чтобы увидеть его на карте</div>
    </div>
    <div id="map-container">
      <div id="map"></div>
      <div id="map-placeholder">Карта загружается…</div>
    </div>
    <div id="stops-panel" style="display:none">
      <h3>Остановки</h3>
      <div id="stops-stats"></div>
      <ol id="stops-list"></ol>
    </div>
  </div>
</div>

<script src="/config.js" defer></script>
<script>
// ===== CSV PARSER =====
function parseCSV(text) {
  const rows = [];
  let current = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { current.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && next === '\n') i++;
        current.push(field); field = '';
        if (current.some(f => f.trim())) rows.push(current);
        current = [];
      } else field += ch;
    }
  }
  if (field || current.length) { current.push(field); if (current.some(f => f.trim())) rows.push(current); }
  return rows;
}

// ===== ROUTE PARSING =====
function parseStartEnd(raw) {
  let n = raw.trim();
  if (n.startsWith('*')) n = n.slice(1).trim();
  const qm = n.match(/"([^"]+)"/);
  if (qm) n = qm[1];
  const seps = [' – ', ' - ', '–', ' -', '- ', '-'];
  for (const sep of seps) {
    const parts = n.split(sep).map(s => s.trim()).filter(s => s);
    if (parts.length >= 2) {
      return { start: parts[0], end: parts[parts.length - 1] };
    }
  }
  return { start: n, end: '' };
}

function parseIntermediateStops(text) {
  const cleaned = text.replace(/\([^)]*\)/g, '');
  return cleaned.split(',').map(s => s.trim()).filter(s => s.length > 0);
}

function removeConsecutiveDupes(arr) {
  return arr.filter((x, i) => i === 0 || x !== arr[i - 1]);
}

function sectionMatch(a, b, kw) {
  return a.includes(kw) || b.includes(kw) || a.startsWith(kw) || b.startsWith(kw);
}

function parseRoutes(csvRows) {
  const dataRows = csvRows.slice(13);
  let currentSection = 'main';
  const groups = [];
  let currentGroup = null;

  for (const row of dataRows) {
    const colA = (row[0] || '').trim();
    const colB = (row[1] || '').trim();
    const colC = (row[2] || '').trim();
    const colD = (row[3] || '').trim();
    const colI = (row[8] || '').trim();

    if (sectionMatch(colA, colB, 'Маршруты работают в дни массовых посещений кладбищ')) { currentSection = 'cemetery'; continue; }
    if (sectionMatch(colA, colB, 'Сезонные маршруты')) { currentSection = 'seasonal'; continue; }
    if (sectionMatch(colA, colB, 'Муниципальные маршруты городского наземного электрического транспорта')) { currentSection = 'trolley'; continue; }
    if (currentSection === 'trolley') continue;

    if (!colC || colC === 'Наименование маршрута') continue;
    if (/^\d+$/.test(colA) && /^\d+$/.test(colB) && /^\d+$/.test(colC)) continue;
    if (colA === 'Регистрационный номер маршрута') continue;

    if (colA && /^\d+$/.test(colA)) {
      const isBus = colI.includes('Автобус');
      if (isBus) {
        currentGroup = { regNumber: parseInt(colA, 10), routeNumber: colB, name: colC, variants: [] };
        groups.push(currentGroup);
        const parsed = parseVariantRow(row);
        currentGroup.variants.push(parsed);
      } else {
        currentGroup = null;
      }
    } else if (currentGroup && colC) {
      const parsed = parseVariantRow(row);
      currentGroup.variants.push(parsed);
    }
  }
  return groups;
}

function parseVariantRow(row) {
  const colC = (row[2] || '').trim();
  const colD = (row[3] || '').trim();
  const se = parseStartEnd(colC);
  const intermediates = parseIntermediateStops(colD);
  let stops = [se.start, ...intermediates, se.end].filter(s => s.length > 0);
  stops = removeConsecutiveDupes(stops);
  return { name: colC, start: se.start, end: se.end, stops };
}

// ===== STOP NORMALIZER =====
const ABBREV = {
  'ул.': 'улица', 'ул': 'улица',
  'пр-т': 'проспект', 'пр‑т': 'проспект', 'пр.': 'проспект', 'просп.': 'проспект',
  'б-р': 'бульвар', 'б‑р': 'бульвар', 'бул.': 'бульвар',
  'пер.': 'переулок', 'пер': 'переулок',
  'пл.': 'площадь', 'пл': 'площадь',
  'ш.': 'шоссе', 'ш': 'шоссе',
  'д.': 'дом',
  'р-н': 'район',
  'м-н': 'микрорайон',
  'мкр.': 'микрорайон', 'мкр': 'микрорайон',
  'кв-л': 'квартал', 'кв.': 'квартал',
};

function normalizeStopName(name) {
  let n = name.trim().toLowerCase();
  n = n.replace(/^оп\s+/i, '');
  n = n.replace(/[«»""'']/g, '');
  n = n.replace(/\(.*?\)/g, '').trim();
  const words = n.split(/\s+/);
  const mapped = words.map(w => ABBREV[w] || w);
  return mapped.join(' ').replace(/\s+/g, ' ').trim();
}

// ===== GEO CODER =====
class GeoCoder {
  constructor(data) {
    this.index = new Map();
    this.rawKeys = new Map();
    if (data && typeof data === 'object') {
      for (const [key, val] of Object.entries(data)) {
        const norm = normalizeStopName(key);
        if (!this.index.has(norm)) this.index.set(norm, val);
        this.rawKeys.set(norm, key);
      }
    }
  }

  find(name) {
    const norm = normalizeStopName(name);
    if (this.index.has(norm)) return { ...this.index.get(norm), matched: this.rawKeys.get(norm) || name };

    const noOp = norm.replace(/^оп\s+/, '');
    if (noOp !== norm && this.index.has(noOp)) return { ...this.index.get(noOp), matched: this.rawKeys.get(noOp) || name };

    for (const [key, val] of this.index) {
      if (key.includes(norm) || norm.includes(key)) {
        return { ...val, matched: this.rawKeys.get(key) || key };
      }
    }
    return null;
  }
}

// ===== MAP CONTROLLER =====
class MapController {
  constructor() { this.map = null; this.placemarks = []; this.polyline = null; this.ready = false; }

  async init(apiKey) {
    return new Promise((resolve) => {
      const script = document.createElement('script');
      script.src = `https://api-maps.yandex.ru/2.1/?apikey=${apiKey}&lang=ru_RU`;
      script.onload = () => {
        ymaps.ready(() => {
          this.map = new ymaps.Map('map', {
            center: [53.520, 49.350],
            zoom: 12,
            controls: ['zoomControl', 'fullscreenControl']
          });
          this.ready = true;
          document.getElementById('map-placeholder').style.display = 'none';
          resolve();
        });
      };
      script.onerror = () => { document.getElementById('map-placeholder').textContent = 'Не удалось загрузить карту'; resolve(); };
      document.head.appendChild(script);
    });
  }

  showRoute(variant, geoCoder) {
    this.clear();

    const coords = [];
    const missing = [];

    for (let i = 0; i < variant.stops.length; i++) {
      const stopName = variant.stops[i];
      const geo = geoCoder.find(stopName);
      if (geo && geo.lat != null && geo.lon != null) {
        coords.push([geo.lat, geo.lon]);
        const placemark = new ymaps.Placemark(
          [geo.lat, geo.lon],
          { hintContent: stopName, balloonContent: `<b>${stopName}</b><br>№ ${i + 1} по маршруту` },
          { preset: i === 0 ? 'islands#greenCircleDotIcon' : i === variant.stops.length - 1 ? 'islands#redCircleDotIcon' : 'islands#blueCircleDotIcon' }
        );
        this.placemarks.push(placemark);
        this.map.geoObjects.add(placemark);
      } else {
        missing.push({ index: i, name: stopName });
      }
    }

    if (coords.length >= 2) {
      this.polyline = new ymaps.Polyline(
        coords,
        {},
        { strokeColor: '#5a7aff', strokeWidth: 4, strokeOpacity: 0.8 }
      );
      this.map.geoObjects.add(this.polyline);
    }

    if (coords.length > 0) {
      this.map.setBounds(this.map.geoObjects.getBounds(), { checkZoomRange: true, zoomMargin: 20 });
    }

    return { total: variant.stops.length, mapped: coords.length, missing };
  }

  clear() {
    if (this.polyline) { this.map.geoObjects.remove(this.polyline); this.polyline = null; }
    this.placemarks.forEach(pm => this.map.geoObjects.remove(pm));
    this.placemarks = [];
  }
}

// ===== APP =====
class App {
  constructor() {
    this.routes = [];
    this.geoCoder = new GeoCoder({});
    this.mapCtrl = new MapController();
    this._selectedGroup = null;
    this._selectedVariant = null;
  }

  async init() {
    try {
      const [csvText, geoJson] = await Promise.all([
        fetch(CONFIG.SHEET_URL).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }),
        fetch('geo.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
      ]);

      this.geoCoder = new GeoCoder(geoJson);
      const csvRows = parseCSV(csvText);
      this.routes = parseRoutes(csvRows);

      document.getElementById('route-count').textContent = `— ${this.routes.length} маршрутов`;

      this.renderRouteList();

      await this.mapCtrl.init(CONFIG.YANDEX_API_KEY);

      document.getElementById('loading').classList.add('hidden');

      if (this.routes.length > 0) {
        this.selectVariant(this.routes[0], 0);
      }
    } catch (err) {
      document.getElementById('loading').classList.add('hidden');
      const errDiv = document.getElementById('error');
      errDiv.classList.remove('hidden');
      document.getElementById('error-msg').textContent = err.message || 'Неизвестная ошибка';
    }
  }

  renderRouteList() {
    const container = document.getElementById('route-list');
    const filterVal = document.getElementById('filter').value.trim().toLowerCase();

    let filtered = this.routes;
    if (filterVal) {
      filtered = this.routes.filter(g => {
        const num = g.routeNumber.replace(/[^0-9]/g, '');
        return g.routeNumber.toLowerCase().includes(filterVal) || num.includes(filterVal);
      });
    }

    container.innerHTML = '';

    for (const group of filtered) {
      const div = document.createElement('div');
      div.className = 'route-group';

      const isSelected = this._selectedGroup && group.regNumber === this._selectedGroup.regNumber;

      const header = document.createElement('div');
      header.className = 'route-group-header' + (isSelected ? ' open' : '');
      header.innerHTML = `<span class="arrow">▶</span>${group.routeNumber || 'б/н'} <span class="badge">${group.variants.length}</span>`;
      header.addEventListener('click', () => {
        header.classList.toggle('open');
        const items = div.querySelector('.variant-items');
        if (items) items.style.display = items.style.display === 'none' ? 'block' : 'none';
      });

      div.appendChild(header);

      const itemsWrap = document.createElement('div');
      itemsWrap.className = 'variant-items';
      itemsWrap.style.display = isSelected ? 'block' : 'none';

      for (let vi = 0; vi < group.variants.length; vi++) {
        const v = group.variants[vi];
        const item = document.createElement('div');
        item.className = 'variant-item';
        item.dataset.reg = group.regNumber;
        item.dataset.vi = vi;
        if (isSelected && vi === this._selectedVariant) item.classList.add('active');
        item.textContent = v.name;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          this.selectVariant(group, vi);
        });
        itemsWrap.appendChild(item);
      }

      div.appendChild(itemsWrap);
      container.appendChild(div);
    }
  }

  selectVariant(group, vi) {
    this._selectedGroup = group;
    this._selectedVariant = vi;

    const variant = group.variants[vi];

    document.querySelectorAll('.variant-item').forEach(el => el.classList.remove('active'));
    const sel = document.querySelector(`.variant-item[data-reg="${group.regNumber}"][data-vi="${vi}"]`);
    if (sel) sel.classList.add('active');

    document.querySelectorAll('.route-group-header').forEach(h => h.classList.add('open'));
    document.querySelectorAll('.variant-items').forEach(w => w.style.display = 'block');

    const infoEl = document.getElementById('route-info');
    const routeNum = group.routeNumber || 'б/н';
    infoEl.innerHTML = `<h2>${routeNum} — ${variant.name}</h2><div class="variant-label">${variant.start} → ${variant.end}</div>`;

    const stopsPanel = document.getElementById('stops-panel');
    const stopsList = document.getElementById('stops-list');
    const stopsStats = document.getElementById('stops-stats');
    stopsPanel.style.display = 'block';
    stopsList.innerHTML = '';
    stopsStats.innerHTML = '';

    if (this.mapCtrl.ready) {
      const result = this.mapCtrl.showRoute(variant, this.geoCoder);

      let mappedCount = 0;
      variant.stops.forEach((s, i) => {
        const li = document.createElement('li');
        li.dataset.idx = (i + 1) + '.';
        const geo = this.geoCoder.find(s);
        if (!geo || geo.lat == null) {
          li.innerHTML = `${s} <span class="missing">(нет координат)</span>`;
        } else {
          mappedCount++;
          li.textContent = s;
        }
        stopsList.appendChild(li);
      });
      stopsStats.innerHTML = `<span class="ok">✓ ${mappedCount}</span> / <span class="ko">✗ ${variant.stops.length - mappedCount}</span> остановок на карте`;
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const app = new App();
  app.init();

  document.getElementById('filter').addEventListener('input', () => app.renderRouteList());
});
</script>
</body>
</html>
